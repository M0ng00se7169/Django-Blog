{% extends "blog/base.html"%}
{% block content %}
<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <h2>You have been logged out</h2>
    <div class="border-top pt-3">
      <small class="text-muted">
        <a href="{% url 'login' %}">Log In Again</a>
      </small>
    </div>
    <button type="submit">logout</button>
</form>


{% endblock content %}
